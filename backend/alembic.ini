# ============================================================
# GenAI DocQA Platform — Alembic Configuration
# ============================================================
# Alembic = database migration tool
# Think of it as "git for your database schema"
#
# Every schema change (add column, create table, add index)
# becomes a versioned migration file that can be:
#   - Applied:   alembic upgrade head
#   - Rolled back: alembic downgrade -1
#   - Previewed: alembic show head
#
# IMPORTANT: We do NOT set sqlalchemy.url here
# It is set programmatically in alembic/env.py
# from settings.DATABASE_URL — one source of truth
# ============================================================

[alembic]
# ── Migration scripts location ────────────────────────────────
# Where Alembic looks for migration files
# Relative to where you run the alembic command (backend/)
script_location = alembic

# ── Migration file naming ─────────────────────────────────────
# How new migration files are named when auto-generated
# %(year)d%(month).2d%(day).2d = date prefix (e.g. 20250314)
# %(rev)s = short revision hash (e.g. a1b2c3d4)
# %(slug)s = slugified version of your -m message
#
# Example: alembic revision -m "create users table"
# Generates: 20250314_a1b2c3d4_create_users_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# ── Timezone for migration timestamps ─────────────────────────
# Use UTC for all timestamps — never local time in production
# Prevents confusion when team members are in different timezones
timezone = UTC

# ── Truncate slug length ──────────────────────────────────────
# Maximum characters from your -m message used in filename
# "create users and llm keys table" → "create_users_and_llm_ke"
truncate_slug_length = 40

# ── sqlalchemy.url ────────────────────────────────────────────
# We intentionally leave this EMPTY
# It is set in alembic/env.py from settings.DATABASE_URL
# This avoids duplicating the connection string in two places
# sqlalchemy.url =         ← intentionally empty


# ============================================================
# LOGGING
# Alembic uses Python's standard logging module
# ============================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
# Set to INFO to see all SQL statements Alembic runs
# Set to WARN in production to reduce noise
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
# INFO shows migration progress (which files are running)
# Useful to see: "Running upgrade -> a1b2c3, create users table"
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# Log format: timestamp + log level + logger name + message
# Example: 2025-03-14 10:30:15,123 INFO  [alembic.runtime] Running upgrade
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
